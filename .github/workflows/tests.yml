name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover scripts
      - name: Check extension manifest is valid JSON
        run: python -m json.tool extension/manifest.json > /dev/null
